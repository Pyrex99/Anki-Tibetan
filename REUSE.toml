version = 1

# make FileCopyrightText optional on all .kt files
# see docs/contributing/copyright-headers.md
[[annotations]]
path = "**.kt"
precedence = "aggregate"
SPDX-FileCopyrightText = "Contributors to the AnkiDroid project"

# Tibetan fork: bundled fonts
[[annotations]]
path = ["AnkiDroid/src/main/res/font/noto_serif_tibetan.ttf", "AnkiDroid/src/main/res/font/inter.ttf"]
SPDX-FileCopyrightText = ["2022 The Noto Project Authors", "2020 The Inter Project Authors"]
SPDX-License-Identifier = "OFL-1.1"
